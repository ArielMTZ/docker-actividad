name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  pruebas:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest -v

      - name: Calcular cobertura
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Mostrar resumen de pruebas
        if: always()
        run: |
          echo "## 🧪 Resumen de pruebas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Estado de las pruebas: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Python utilizado: **3.12**" >> $GITHUB_STEP_SUMMARY
          echo "- Framework de pruebas: **pytest**" >> $GITHUB_STEP_SUMMARY
          echo "- Métrica utilizada: **Cobertura de código**" >> $GITHUB_STEP_SUMMARY

  docker:
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t docker-actividad .

      - name: Mostrar resumen de Docker
        if: always()
        run: |
          echo "## 🐳 Resumen Docker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Imagen: **docker-actividad**" >> $GITHUB_STEP_SUMMARY
          echo "- Estado de construcción: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY